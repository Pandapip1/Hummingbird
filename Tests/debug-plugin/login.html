<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hummingbird debug sign in</title>
  <style>
    :root { color-scheme: light dark; font: 16px system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #172033; }

    h1 { margin-top: 0; }
    a { display: inline-block; margin-top: 1rem; padding: .75rem 1.1rem; border-radius: .6rem; background: #4263eb; color: white; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>Debug source sign in</h1>

    <a id="sign-in" href="/login-complete">Sign in</a>
  </main>

</html>
