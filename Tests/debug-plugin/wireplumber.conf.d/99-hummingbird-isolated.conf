# WirePlumber profile for Hummingbird's isolated audio playback test
# (DebugPluginAudioPlaybackTests.swift / IsolatedAudioSession.swift).
#
# `XDG_RUNTIME_DIR` alone does not stop WirePlumber from enumerating the host's
# real ALSA/Bluetooth/V4L hardware — confirmed empirically: a default-profile
# WirePlumber pointed at a scratch runtime dir still listed the host's real
# microphone and camera. This profile disables those monitor components, so the
# scratch PipeWire instance this test spins up can never touch the developer's
# real speakers/mic, and so the test behaves the same way in a container with no
# sound hardware at all. The only sink it should ever see is the `module-null-sink`
# the test creates itself.
#
# Loaded by copying this file into a scratch `$XDG_CONFIG_HOME/wireplumber/
# wireplumber.conf.d/`, then running `wireplumber -p hummingbird-test`.
wireplumber.profiles = {
  hummingbird-test = {
    inherits = [ main ]
    monitor.alsa = disabled
    monitor.alsa-midi = disabled
    monitor.bluez = disabled
    monitor.bluez-midi = disabled
    monitor.v4l2 = disabled
  }
}
