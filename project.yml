name: Hummingbird
options:
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
    tvOS: "18.0"
    visionOS: "2.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  # No target may share a name with a package or a package product (here
  # the xtool app product "Hummingbird"): xcodebuild would build the package
  # in its place, and UI tests would find no app to install. So the app target
  # is "Hummingbird-App", building Hummingbird.app; scripts/generate-app
  # refuses clashing names.
  HummingbirdPackage:
    path: .
  SwiftOpenUI:
    path: Vendor/SwiftOpenUI
targets:
  # BEGIN GENERATED by scripts/generate-app from Apps/AppManifest.swift; do not edit.
  Hummingbird-App:
    type: application
    platform: iOS
    sources:
      - path: Apps/iOS
        excludes:
          - Hummingbird.icon
          - Hummingbird.xtool.entitlements
      - path: Apps/iOS/Hummingbird.icon
    dependencies:
      - package: HummingbirdPackage
        product: HummingbirdKit
      - package: SwiftOpenUI
        product: SwiftOpenUI
      - package: HummingbirdPackage
        product: PluginEngine
      - package: HummingbirdPackage
        product: CJSCExecutionLimit
      - target: PluginHostXPC
        destinationFilters: [macOS]
        embed: true
    settings:
      base:
        PRODUCT_NAME: Hummingbird
        PRODUCT_BUNDLE_IDENTIFIER: com.eightybps.hummingbird
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Apps/iOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Apps/iOS/Hummingbird.entitlements
        DEVELOPMENT_TEAM: NMM6M6QVAT
        ASSETCATALOG_COMPILER_APPICON_NAME: Hummingbird
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_INCOMING_NETWORK_CONNECTIONS: YES
        ENABLE_RESOURCE_ACCESS_CAMERA: YES
        TARGETED_DEVICE_FAMILY: "1,2,3,7"
        SUPPORTED_PLATFORMS: "appletvos appletvsimulator iphoneos iphonesimulator macosx xros xrsimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_HARDENED_RUNTIME: YES
        REGISTER_APP_GROUPS: YES
        HUMMINGBIRD_DISTRIBUTION: direct
        HUMMINGBIRD_DISTRIBUTION_CONDITIONS_appstore: "APP_STORE"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) $(HUMMINGBIRD_DISTRIBUTION_CONDITIONS_$(HUMMINGBIRD_DISTRIBUTION))"
  # END GENERATED app target.
  # The macOS plugin host (Documentation/PluginSecurity.md, process isolation): an XPC service with
  # a sandbox of its own and no entitlement beyond it, one instance per plugin (Info.plist), which
  # the app kills when a plugin overruns its deadline. Embedded in the Mac app only (AppManifest).
  PluginHostXPC:
    type: xpc-service
    platform: macOS
    sources:
      - path: Apps/PluginHostXPC
        excludes:
          - Info.plist
          - PluginHost.entitlements
    dependencies:
      - package: HummingbirdPackage
        product: PluginEngine
      - package: SwiftOpenUI
        product: PlatformSupport
    settings:
      base:
        PRODUCT_NAME: PluginHost
        PRODUCT_BUNDLE_IDENTIFIER: com.eightybps.hummingbird.PluginHost
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Apps/PluginHostXPC/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Apps/PluginHostXPC/PluginHost.entitlements
        DEVELOPMENT_TEAM: NMM6M6QVAT
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
  HummingbirdTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - path: Tests/HummingbirdTVUITests
      - path: Tests/UITestSupport
    dependencies:
      - target: Hummingbird-App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eightybps.hummingbird.TVUITests
        DEVELOPMENT_TEAM: NMM6M6QVAT
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Hummingbird-App
  HummingbirdIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/HummingbirdIOSUITests
      - path: Tests/UITestSupport
    dependencies:
      - target: Hummingbird-App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eightybps.hummingbird.IOSUITests
        DEVELOPMENT_TEAM: NMM6M6QVAT
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Hummingbird-App
  Hummingbird GTK Launcher:
    type: tool
    platform: macOS
    sources:
      - path: Apps/GTKLauncher
    dependencies:
      - target: Hummingbird GTK
    settings:
      base:
        PRODUCT_NAME: Hummingbird GTK
aggregateTargets:
  Hummingbird GTK:
    buildScripts:
      - name: Build GTK application
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          nix_bin="$(command -v nix || true)"
          if [ -z "$nix_bin" ] && [ -x /run/current-system/sw/bin/nix ]; then
            nix_bin=/run/current-system/sw/bin/nix
          fi
          if [ -z "$nix_bin" ] && [ -x /nix/var/nix/profiles/default/bin/nix ]; then
            nix_bin=/nix/var/nix/profiles/default/bin/nix
          fi
          if [ -z "$nix_bin" ]; then
            echo "error: Nix is required to build Hummingbird GTK" >&2
            exit 1
          fi
          cd "$SRCROOT"
          exec "$nix_bin" shell nixpkgs#git --command "$nix_bin" develop --command hb-build-gtk --disable-sandbox
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: NO
schemes:
  # Day-to-day debugging: Main Thread Checker and Thread Performance Checker
  # on (Xcode's defaults, stated here so they stay on), Hummingbird's lldb
  # formatters and `hb` commands loaded. See Documentation/Debugging.md.
  Hummingbird:
    build:
      targets:
        Hummingbird-App: all
    run:
      customLLDBInit: $(SRCROOT)/Tools/lldb/lldbinit
      disableMainThreadChecker: false
      stopOnEveryMainThreadCheckerIssue: true
      disableThreadPerformanceChecker: false
    test:
      customLLDBInit: $(SRCROOT)/Tools/lldb/lldbinit
      targets:
        - HummingbirdTVUITests
        - HummingbirdIOSUITests
  # Memory errors and undefined behaviour (Address Sanitizer, Undefined
  # Behavior Sanitizer). Slower; run it when chasing crashes.
  Hummingbird (Address Sanitizer):
    build:
      targets:
        Hummingbird-App: all
    run:
      customLLDBInit: $(SRCROOT)/Tools/lldb/lldbinit
      enableAddressSanitizer: true
      enableUBSanitizer: true
  # Data races (Thread Sanitizer; cannot be combined with Address Sanitizer).
  Hummingbird (Thread Sanitizer):
    build:
      targets:
        Hummingbird-App: all
    run:
      customLLDBInit: $(SRCROOT)/Tools/lldb/lldbinit
      enableThreadSanitizer: true
  Hummingbird GTK:
    build:
      targets:
        Hummingbird GTK Launcher: all
    run:
      executable: Hummingbird GTK Launcher
      customWorkingDirectory: $(SRCROOT)
