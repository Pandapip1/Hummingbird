name: Hummingbird
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Hummingbird:
    path: .
targets:
  Hummingbird:
    type: application
    platform: iOS
    sources:
      - path: Apps/iOS
        excludes:
          - Hummingbird.icon
      - path: Apps/iOS/Hummingbird.icon
    dependencies:
      - package: Hummingbird
        product: HummingbirdKit
    info:
      path: Apps/iOS/Info.plist
      properties:
        CFBundleDisplayName: Hummingbird
        ATProtoKeychainAccessGroup: $(AppIdentifierPrefix)com.eightybps.Hummingbird.shared
        CFBundleURLTypes:
          - CFBundleURLName: app.hummingbird.credential-login
            CFBundleURLSchemes:
              - hummingbird
          - CFBundleURLName: com.eightybps.hummingbird.oauth
            CFBundleURLSchemes:
              - com.eightybps.hummingbird
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        NSCameraUsageDescription: Used to scan QR codes that add plugin sources.
        # Plugins talk to arbitrary hosts (and developers serve plugins over http on the LAN),
        # so plugin traffic cannot be restricted by ATS. The per-plugin allowUrls list is the real gate.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Hummingbird uses your local network to transfer plugin sign-in credentials and load locally hosted plugins.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pandapip1.Hummingbird
        CODE_SIGN_ENTITLEMENTS: Apps/iOS/Hummingbird.entitlements
        DEVELOPMENT_TEAM: NMM6M6QVAT
        TARGETED_DEVICE_FAMILY: "1,2,3,7"
        SUPPORTED_PLATFORMS: "appletvos appletvsimulator iphoneos iphonesimulator macosx xros xrsimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        # Used by DebugKit during development and by device sync.
        ENABLE_INCOMING_NETWORK_CONNECTIONS: YES
        ENABLE_RESOURCE_ACCESS_CAMERA: YES
        REGISTER_APP_GROUPS: YES
        INFOPLIST_KEY_CFBundleDisplayName: Hummingbird
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.video"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: Hummingbird
  HummingbirdTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - path: Tests/HummingbirdTVUITests
    dependencies:
      - target: Hummingbird
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pandapip1.HummingbirdTVUITests
        DEVELOPMENT_TEAM: NMM6M6QVAT
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Hummingbird
  HummingbirdIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/HummingbirdIOSUITests
    dependencies:
      - target: Hummingbird
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pandapip1.HummingbirdIOSUITests
        DEVELOPMENT_TEAM: NMM6M6QVAT
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Hummingbird
aggregateTargets:
  Hummingbird GTK:
    buildScripts:
      - name: Build GTK application
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          nix_bin="$(command -v nix || true)"
          if [ -z "$nix_bin" ] && [ -x /run/current-system/sw/bin/nix ]; then
            nix_bin=/run/current-system/sw/bin/nix
          fi
          if [ -z "$nix_bin" ] && [ -x /nix/var/nix/profiles/default/bin/nix ]; then
            nix_bin=/nix/var/nix/profiles/default/bin/nix
          fi
          if [ -z "$nix_bin" ]; then
            echo "error: Nix is required to build Hummingbird GTK" >&2
            exit 1
          fi
          cd "$SRCROOT"
          exec "$nix_bin" develop --command hb-build-gtk --disable-sandbox
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: NO
schemes:
  Hummingbird:
    build:
      targets:
        Hummingbird: all
    test:
      targets:
        - HummingbirdTVUITests
        - HummingbirdIOSUITests
  Hummingbird GTK:
    build:
      targets:
        Hummingbird GTK: all
