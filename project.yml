name: Hummingbird
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Hummingbird:
    path: .
targets:
  Hummingbird:
    type: application
    platform: iOS
    sources:
      - path: Apps/iOS
    dependencies:
      - package: Hummingbird
        product: HummingbirdKit
    info:
      path: Apps/iOS/Info.plist
      properties:
        CFBundleDisplayName: Hummingbird
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        NSCameraUsageDescription: Used to scan QR codes that add plugin sources.
        # Plugins talk to arbitrary hosts (and developers serve plugins over http on the LAN),
        # so plugin traffic cannot be restricted by ATS. The per-plugin allowUrls list is the real gate.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Used to load plugins served from your own computer during development.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pandapip1.Hummingbird
        DEVELOPMENT_TEAM: NMM6M6QVAT
        TARGETED_DEVICE_FAMILY: "1,2,3,7"
        SUPPORTED_PLATFORMS: "appletvos appletvsimulator iphoneos iphonesimulator macosx xros xrsimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_RESOURCE_ACCESS_CAMERA: YES
        REGISTER_APP_GROUPS: YES
        INFOPLIST_KEY_CFBundleDisplayName: Hummingbird
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.video"
        GENERATE_INFOPLIST_FILE: NO
schemes:
  Hummingbird:
    build:
      targets:
        Hummingbird: all
