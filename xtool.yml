# Builds the app with xtool (https://xtool.sh) rather than Xcode:
#   xtool dev build --triple arm64-apple-macosx
# The app is the HummingbirdApp product in Package.swift (so xtool makes
# HummingbirdApp.app; install it as Hummingbird.app); the Info.plist, icon and
# asset catalog are the ones the Xcode project (project.yml) uses.
version: 1
bundleID: com.eightybps.hummingbird
product: HummingbirdApp
infoPath: Apps/iOS/Info.plist
iconPath: Apps/iOS/Hummingbird.icon
resources:
  - Apps/iOS/Assets.xcassets
